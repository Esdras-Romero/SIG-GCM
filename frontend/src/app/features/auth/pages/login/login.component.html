<section class="min-h-screen flex items-center justify-center bg-[#111827]">

  <div class="w-full max-w-md bg-[#1f2937] rounded-2xl shadow-2xl p-8 border border-gray-700">

    <div class="flex justify-center mb-6">
      <img
        src="/imagens/logo-sig-gcm.jpeg"
        alt="Logo SIG-GCM"
        class="w-40 h-40 object-contain rounded-2xl border-4 border-blue-500 shadow-2xl"
      />
    </div>

    <h1 class="text-3xl font-bold text-center text-white mb-2">
      SIG-GCM
    </h1>

    <p class="text-center text-gray-400 mb-6">
      Sistema de Gestão da Guarda Civil Municipal
    </p>

    <form
      (ngSubmit)="entrar()"
      class="space-y-4"
    >

      <div>

        <label class="block mb-1 font-medium text-gray-300">
          E-mail
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          class="w-full rounded-lg p-3 bg-[#111827] border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        />

      </div>

      <div>

        <label class="block mb-1 font-medium text-gray-300">
          Senha
        </label>

        <input
          type="password"
          name="senha"
          [(ngModel)]="senha"
          class="w-full rounded-lg p-3 bg-[#111827] border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          required
        />

      </div>

      @if (mensagemErro()) {

        <p class="text-red-400 text-sm">
          {{ mensagemErro() }}
        </p>

      }

      <button
        type="submit"
        class="w-full bg-blue-700 hover:bg-blue-800 transition text-white rounded-lg p-3 font-semibold"
        [disabled]="loading()"
      >
        {{ loading() ? 'Entrando...' : 'Entrar' }}
      </button>

    </form>

  </div>

</section>
