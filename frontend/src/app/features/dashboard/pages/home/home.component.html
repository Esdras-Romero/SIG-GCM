<section class="min-h-screen bg-[#111827] text-white flex">

  <aside class="w-64 bg-[#1f2937] border-r border-gray-700 p-6 flex flex-col justify-between">

    <div>
      <h2 class="text-xl font-bold mb-6 text-blue-400 tracking-wide">
        SIG-GCM
      </h2>

      <nav class="flex flex-col gap-3">

        <div class="mt-2 mb-1">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">
            Diretoria Operacional
          </p>
          <div class="h-px bg-gray-700 mt-1 mb-2"></div>
        </div>

        <a routerLink="/guardas" class="bg-blue-700 hover:bg-blue-800 px-4 py-3 rounded-lg text-center">
          Gerenciar Guardas
        </a>

        <a routerLink="/postos" class="bg-blue-700 hover:bg-blue-800 px-4 py-3 rounded-lg text-center">
          Gerenciar Postos
        </a>

        <a routerLink="/lotacoes" class="bg-blue-700 hover:bg-blue-800 px-4 py-3 rounded-lg text-center">
          Gerenciar Lotações
        </a>

        <a routerLink="/escalas" class="bg-blue-700 hover:bg-blue-800 px-4 py-3 rounded-lg text-center">
          Escalas
        </a>

        <a routerLink="/relatorios" class="bg-blue-700 hover:bg-blue-800 px-4 py-3 rounded-lg text-center">
          Relatórios
        </a>

        <div class="mt-4 mb-1">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">
            Cadastros
          </p>
          <div class="h-px bg-gray-700 mt-1 mb-2"></div>
        </div>

        <a routerLink="/guardas/cadastro" [queryParams]="{ origem: 'dashboard' }" class="bg-green-700 hover:bg-green-800 px-4 py-3 rounded-lg text-center">
          Cadastrar Guarda
        </a>

        <a routerLink="/postos/cadastro" [queryParams]="{ origem: 'dashboard' }" class="bg-green-700 hover:bg-green-800 px-4 py-3 rounded-lg text-center">
          Cadastrar Posto
        </a>

        <a routerLink="/lotacoes/cadastro" [queryParams]="{ origem: 'dashboard' }" class="bg-green-700 hover:bg-green-800 px-4 py-3 rounded-lg text-center">
          Cadastrar Lotação
        </a>

        <a routerLink="/escalas/gerar" class="bg-purple-700 hover:bg-purple-800 px-4 py-3 rounded-lg text-center">
          Gerar Escala
        </a>

      </nav>
    </div>

    <div class="mt-auto pt-6 border-t border-gray-700">
      <a
        routerLink="/auth/login"
        class="bg-red-700/80 hover:bg-red-700 px-4 py-3 rounded-lg flex items-center justify-center w-full"
      >
        Sair do Sistema
      </a>
    </div>

  </aside>

  <main class="flex-1 flex flex-col items-center justify-center p-10">

    <img
      src="/imagens/logo-sig-gcm.jpeg"
      alt="Logo SIG-GCM"
      class="w-44 h-44 object-contain rounded-2xl border-4 border-blue-500 shadow-2xl mb-6"
    />

    <h1 class="text-3xl font-bold mb-3 tracking-tight">
      SIG-GCM
    </h1>

    <p class="text-gray-400 text-center max-w-2xl text-lg">
      Sistema de Gestão da Guarda Civil Municipal.
    </p>

  </main>

</section>
