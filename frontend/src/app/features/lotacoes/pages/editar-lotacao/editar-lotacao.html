<section class="p-6 max-w-xl text-gray-200">

  <h1 class="text-2xl font-bold mb-6 text-white">
    Editar Lotação
  </h1>

  @if (loading() && !lotacao) {
    <p class="text-gray-400">
      Carregando dados da lotação...
    </p>
  }

  @if (mensagemErro()) {
    <p class="text-red-400 mb-4 font-medium">
      {{ mensagemErro() }}
    </p>
  }

  @if (lotacao) {

    <form
      (ngSubmit)="salvar()"
      class="space-y-4"
    >

      <!-- Guarda -->

      <div>
        <label class="block mb-1 text-gray-300 font-medium">
          Guarda
        </label>

        <select
          name="guardaId"
          [(ngModel)]="lotacao.guardaId"
          class="w-full bg-gray-800 text-white border border-gray-700 rounded p-2"
          required
        >
          @for (guarda of guardasDisponiveis(); track guarda.id) {
            <option
              [value]="guarda.id"
              class="bg-gray-800"
            >
              {{ guarda.nome }} - {{ guarda.matricula }}
            </option>
          }
        </select>
      </div>

      <!-- Posto -->

      <div>
        <label class="block mb-1 text-gray-300 font-medium">
          Posto
        </label>

        <select
          name="postoId"
          [(ngModel)]="lotacao.postoId"
          (change)="aoSelecionarPosto()"
          class="w-full bg-gray-800 text-white border border-gray-700 rounded p-2"
          required
        >
          @for (posto of postosStore.postos(); track posto.id) {
            <option
              [value]="posto.id"
              class="bg-gray-800"
            >
              {{ posto.nome }} - {{ posto.tipoEscala }}
            </option>
          }
        </select>
      </div>

      <!-- Grupo -->

      @if (gruposDisponiveis.length > 0) {

        <div>
          <label class="block mb-1 text-gray-300 font-medium">
            Grupo
          </label>

          <select
            name="grupo"
            [(ngModel)]="lotacao.grupo"
            class="w-full bg-gray-800 text-white border border-gray-700 rounded p-2"
          >
            @for (grupo of gruposDisponiveis; track grupo) {
              <option
                [value]="grupo"
                class="bg-gray-800"
              >
                {{ grupo }}
              </option>
            }
          </select>
        </div>

      }

      <!-- Turno -->

      @if (turnosDisponiveis.length > 0) {

        <div>
          <label class="block mb-1 text-gray-300 font-medium">
            Turno
          </label>

          <select
            name="turno"
            [(ngModel)]="lotacao.turno"
            class="w-full bg-gray-800 text-white border border-gray-700 rounded p-2"
          >
            @for (turno of turnosDisponiveis; track turno) {
              <option
                [value]="turno"
                class="bg-gray-800"
              >
                {{ turno }}
              </option>
            }
          </select>
        </div>

      }

      <!-- Ativo -->

      <label class="flex items-center gap-2 text-gray-300 font-medium">
        <input
          type="checkbox"
          name="ativo"
          [(ngModel)]="lotacao.ativo"
        />
        Ativa
      </label>

      <!-- Botões -->

      <div class="flex gap-2 pt-2">

        <button
          type="submit"
          class="bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-600"
          [disabled]="loading()"
        >
          {{ loading() ? 'Salvando...' : 'Salvar Alterações' }}
        </button>

        <a
          routerLink="/lotacoes"
          class="bg-gray-700 text-white px-4 py-2 rounded hover:bg-gray-600"
        >
          Voltar
        </a>

      </div>

    </form>

  }

</section>
